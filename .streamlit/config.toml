[theme]
primaryColor = "#1f77b4"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f0f2f6"
textColor = "#262730"
font = "sans serif"

[server]
headless = true
port = 8501
enableCORS = false
enableXsrfProtection = true
maxUploadSize = 200

[browser]
gatherUsageStats = false

[client]
# pages/ holds modules that app.py imports, not standalone Streamlit pages.
# Without this, Streamlit auto-detects the folder and lists login_page,
# labeling_page and admin_page in the sidebar, which is confusing for labelers
# and lets anyone click straight into the admin module.
showSidebarNavigation = false
